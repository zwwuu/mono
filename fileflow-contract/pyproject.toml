[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileflow-contract"
version = "1.0.0"
description = "FileFlow manifest contract: the transfer manifest format, the run idempotency key, and SHA-256 verification. Stdlib only, so any project can depend on it."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF", "BLE", "S110"]
