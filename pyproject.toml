[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-monorepo"
version = "0.1.0"
description = "Python monorepo template: several apps sharing common libraries, built to executables with PyInstaller"
readme = "README.md"
requires-python = ">=3.10"
# becomes available to all apps (see README).
dependencies = ["pypdf>=4"]

# One console command per app: `app-one` etc. after install.
# The packages live under src/apps/, so the entry points are the
# apps.* packages — not top-level app_one / pdf_form_check, which
# do not exist in this layout.
[project.scripts]
app-one = "apps.app_one.main:main"
pdf-form-check = "apps.pdf_form_check.cli:main"

[project.optional-dependencies]
# Everything needed for development, testing, and building exes.
# reportlab is only for generating fixture PDFs in the tests.
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyinstaller>=6",
    "reportlab>=4",
]

# All importable packages live under src/ — apps under src/apps/ and
# shared libraries under src/common/ — so one `pip install -e .`
# makes everything importable, and PyInstaller only needs src/ on
# its path (see each app's build.py).
[tool.setuptools.packages.find]
where = ["src"]

# Data files inside an app package (config/*.json, assets/*.txt, ...)
# are part of the installed package, so load_app_config /
# app_file_path find them in an install as well as from source.
[tool.setuptools.package-data]
"*" = ["*.txt", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import apps.* from src/ and tests.* from the repo root,
# without requiring an install first.
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py310"
