[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileflow-agent"
version = "2.16.0"
description = "FileFlow Agent (Ethernet PC): download from the website, rename/format, seal with a SHA-256 manifest, upload to the FTP server; in pickup mode, upload staged files from the FTP server to the website."
requires-python = ">=3.10"
dependencies = ["fileflow-contract>=1.1", "sqlalchemy>=2.0", "alembic>=1.13"]
# Optional, per source type: SFTP transport / remote-dir over SFTP,
# Selenium / Playwright source, SMB source
# paramiko>=3.0 / selenium>=4.6 / playwright>=1.40 / smbprotocol>=1.10

[project.optional-dependencies]
sftp = ["paramiko>=3.0"]
selenium = ["selenium>=4.6"]
playwright = ["playwright>=1.40"]
smb = ["smbprotocol>=1.10"]
dev = ["pytest>=8"]

[project.scripts]
fileflow-agent = "fileflow_agent.adapters.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF", "BLE", "S110"]
