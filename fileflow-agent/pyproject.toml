[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileflow-agent"
version = "1.0.0"
description = "FileFlow Agent (Ethernet PC): download from the website, rename/format, seal with a SHA-256 manifest, upload to the FTP server; in pickup mode, upload staged files from the FTP server to the website."
requires-python = ">=3.10"
dependencies = []
# Optional: SFTP transport only
# paramiko>=3.0

[project.optional-dependencies]
sftp = ["paramiko>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
fileflow-agent = "fileflow_agent.agent:main"

[tool.setuptools.packages.find]
where = ["src"]
