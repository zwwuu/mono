# Alembic config for the FileFlow ledger database.
# The database URL is taken from the environment at run time:
#   FILEFLOW_DB_URL       full SQLAlchemy URL, e.g. sqlite:////var/lib/fileflow-agent/agent.db
#   FILEFLOW_LEDGER_DB    path to the SQLite file (default: fileflow.db)
# If neither is set, migrations/env.py falls back to sqlite:///./fileflow.db.
# Run from the project root:
#   alembic upgrade head          # new database: create the runs table
#   alembic stamp head            # existing database (already has runs): mark it current
#   alembic revision -m "add x"   # new schema change (autogenerate: --autogenerate)

[alembic]
script_location = migrations
prepend_sys_path = .
sourceless = false
sqlalchemy.url = sqlite:///./fileflow.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
