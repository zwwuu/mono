[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileflow-watcher"
version = "1.0.0"
description = "FileFlow Watcher (FTP server): claim, verify, route, run business procedures, publish to the share drive; also stage share-drive files into outgoing/ for the agent to upload to the website."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fileflow-watcher = "fileflow_watcher.watcher:main"

[tool.setuptools.packages.find]
where = ["src"]
