[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app-two"
description = "File lister: lists files by glob and proves bundled-asset loading."
requires-python = ">=3.10"
# Shared code is not a pip dependency: this app imports `common.*`
# from the monorepo. Install the template root (or copy src/common/)
# for a standalone checkout.
dependencies = []
dynamic = ["version"]

# The version is read from the app's meta.py, so the name and version
# stay defined once (see src/app_two/meta.py).
[tool.setuptools.dynamic]
version = {attr = "app_two.meta.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# Config/assets live inside the app package, so they must be declared
# as package data or wheels/sdists would ship code without its data.
[tool.setuptools.package-data]
app_two = ["config/*", "assets/*", "templates/**"]

[project.scripts]
app-two = "app_two.__main__:main"
