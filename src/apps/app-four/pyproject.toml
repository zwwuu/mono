[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app-four"
description = "Duplicate finder: groups files by size then SHA-256, writes a JSON manifest, emails a summary."
requires-python = ">=3.10"
# Shared code is not a pip dependency: this app imports `common.*`
# from the monorepo. Install the template root (or copy src/common/)
# for a standalone checkout.
dependencies = []
dynamic = ["version"]

# The version is read from the app's meta.py, so the name and version
# stay defined once (see src/app_four/meta.py).
[tool.setuptools.dynamic]
version = {attr = "app_four.meta.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# Config/assets live inside the app package, so they must be declared
# as package data or wheels/sdists would ship code without its data.
[tool.setuptools.package-data]
app_four = ["config/*", "assets/*"]

[project.scripts]
app-four = "app_four.__main__:main"
