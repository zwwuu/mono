[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app-one"
description = "Report sender: builds a short report from a bundled template and emails it."
requires-python = ">=3.10"
# Shared code is not a pip dependency: this app imports `common.*`
# from the monorepo. Install the template root (or copy src/common/)
# for a standalone checkout.
dependencies = []
dynamic = ["version"]

# The version is read from the app's meta.py, so the name and version
# stay defined once (see src/app_one/meta.py).
[tool.setuptools.dynamic]
version = {attr = "app_one.meta.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# Config/assets live inside the app package, so they must be declared
# as package data or wheels/sdists would ship code without its data.
[tool.setuptools.package-data]
app_one = ["config/*", "assets/*", "disclaimer.txt"]

[project.scripts]
app-one = "app_one.__main__:main"
